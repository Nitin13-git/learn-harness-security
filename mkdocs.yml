site_name: Learn Harness Security
site_description: Harness engineering for the adversarial case — security-benchmark tasks where the target fights back.
site_url: https://nitin13-git.github.io/learn-harness-security/
repo_url: https://github.com/Nitin13-git/learn-harness-security
repo_name: Nitin13-git/learn-harness-security
edit_uri: edit/main/docs/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: black
      accent: red
      toggle:
        icon: material/weather-night
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: black
      accent: red
      toggle:
        icon: material/weather-sunny
        name: Switch to dark mode
  features:
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - content.code.copy
    - content.action.edit
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.snippets:
      base_path: ["."]
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - tables
  - toc:
      permalink: true

nav:
  - Home: index.md
  - Lectures:
      - "L01 — Why security harnesses are different": lectures/l01-why-security-harnesses-are-different.md
      - "L02 — Scope as a security boundary": lectures/l02-scope-as-a-security-boundary.md
      - "L03 — Verification you can trust": lectures/l03-verification-you-can-trust.md
      - "L04 — Context is not free": lectures/l04-context-is-not-free.md
      - "L05 — The four subsystems as a protocol": lectures/l05-the-four-subsystems-as-a-protocol.md
      - "L06 — Closing the loop: EvoBench": lectures/l06-closing-the-loop-evobench.md
      - "L07 — Loop engineering for security benchmarks": lectures/l07-loop-engineering-for-security-benchmarks.md
      - "L08 — Graph engineering: multi-target campaigns": lectures/l08-graph-engineering-multi-target-campaigns.md
  - Experiments:
      - "E01 — Pallas Model Shootout": experiments/e01-pallas-model-shootout.md
      - "E02 — EvoBench end to end": experiments/e02-evobench-end-to-end.md
  - Projects:
      - "P01 — Verify, don't trust": projects/p01-verify-dont-trust.md
  - Skills: skills/security-harness-creator.md
  - Frontier Harness Design Breakdowns:
      - "PentAGI": frontier/pentagi-breakdown.md
  - Open Problems: open-problems.md
  - Library: resources.md
  - Try Harness ↗: https://github.com/Nitin13-git/learn-harness-security/tree/main/resources
